<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>NSW Digital Licence Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="licence-wrapper">
  <!-- add this line: -->
  <div class="holo-overlay"></div>

  <div class="front">
    <!-- …all your logo, photo, text etc. here… -->
  </div>

  <div class="footer">…​</div>
</div>


      <img src="assets/profile.jpg" class="photo" alt="Profile">

      <div class="info">
        <h2>Steve CITIZEN</h2>
        <div class="details">LICENCE NUMBER: 132842687</div>
        <div class="details">EXPIRY: 12 May 2023</div>
        <div class="details">DATE OF BIRTH: 10 Feb 1989</div>
        <div class="details">CLASS: C   CONDITIONS: –</div>
      </div>

      <img src="assets/qr.png" class="qr" alt="QR Code">
    </div>

    <div class="footer">
      <span class="card-number">
        132842687<br>Card Number
      </span>
      <img src="assets/warratah.png" alt="NSW Logo">
    </div>
  </div>

  <!-- Liquid-shimmer SVG filter -->
  <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <filter id="liquidDistortion">
      <feTurbulence id="turbulence" type="turbulence"
                    baseFrequency="0.01 0.02" numOctaves="3"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence"
                         scale="30" xChannelSelector="R"
                         yChannelSelector="G"/>
    </filter>
  </svg>

  <script src="script.js"></script>
</body>
</html>
